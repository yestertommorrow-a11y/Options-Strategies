                  <ReferenceLine y={0} stroke="#444" strokeWidth={1} />
                  <ReferenceLine x={stockPrice} stroke="#555" strokeDasharray="5 5" label={{ position: 'top', value: 'Spot', fill: '#888', fontSize: 10 }} />
                  <Line type="linear" dataKey="expiryPL" name="At First Expiry" stroke="#00d09c" strokeWidth={3} dot={false} animationDuration={300} />
                  <Line type="monotone" dataKey="currentPL" name="Theoretical" stroke="#ffc107" strokeWidth={2} strokeDasharray="5 5" dot={false} animationDuration={0} />
                </ComposedChart>
              </ResponsiveContainer>
            </div>
            {showLegs && <div className="flex flex-wrap gap-3 mt-3 text-xs" aria-label="Individual leg legend">{legs.map((leg,i)=><span key={leg.id} style={{color:LEG_COLORS[i%LEG_COLORS.length]}}>━━ Leg {i+1}: {leg.action} {leg.type}{leg.type!==OptionType.Stock ? ` $${leg.strike}` : ''} · T+{simulatedDays}</span>)}</div>}
            <p className="text-xs text-gray-400 text-center mt-3">Teal + profit / rose − loss at first expiry • amber dashed: simulated total P/L</p>
            <div className="flex justify-center gap-8 mt-2 text-xs font-bold uppercase tracking-widest">
              <div className="flex items-center gap-2">
                <div className="w-4 h-1 bg-tasty-accent shadow-[0_0_8px_rgba(0,208,156,0.4)]"></div>
                <span className="text-gray-400">At First Expiry</span>
              </div>
              <div className="flex items-center gap-2">
                <div className="w-4 h-1 border-b-2 border-dashed border-yellow-400"></div>
                <span className="text-gray-400">T+{simulatedDays} Theoretical</span>
              </div>
            </div>
          </>
        );

        return (
          <>
            <div className="w-full bg-tasty-dark rounded-lg p-4 border border-gray-800 shadow-xl overflow-hidden relative">
              {ChartContent}
            </div>
            {isFullScreen && (
              <div className="fixed inset-0 z-[100] bg-black/95 backdrop-blur-xl flex flex-col p-6">
                <div className="max-w-7xl mx-auto w-full flex-1 flex flex-col">
                  <div className="bg-tasty-panel p-6 rounded-2xl border border-gray-700 shadow-2xl flex-1 flex flex-col">
                    {ChartContent}
                  </div>
                </div>
              </div>
            )}
          </>
        );
      };

      const StrategyGreeks = ({ legs, stockPrice }) => {
        const greeks = useMemo(() => getStrategyGreeks(legs, stockPrice), [legs, stockPrice]);
        const fmt = (v) => (Math.abs(v) < 0.01 && v !== 0) ? v.toFixed(4) : v.toFixed(2);
        const GreekCard = ({ label, value, icon: Icon, colorClass, tooltip }) => (
          <div className="bg-tasty-panel p-4 rounded-lg border border-gray-700 flex flex-col justify-between h-full relative group cursor-help" title={tooltip}>
            <div className="flex items-center gap-2 mb-2 text-gray-400 text-xs font-bold uppercase tracking-wider">
              <Icon size={14} /><span>{label}</span>
            </div>
            <div className={`text-2xl font-mono font-bold ${colorClass}`}>{value > 0 ? '+' : ''}{fmt(value)}</div>
          </div>
        );
        return (
          <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
            <GreekCard label="Delta" value={greeks.delta} icon={TrendingUp} colorClass="text-blue-400" tooltip="Rate of change of value w.r.t. underlying price. +Delta benefits from price rise." />
            <GreekCard label="Gamma" value={greeks.gamma} icon={Activity} colorClass="text-purple-400" tooltip="Rate of change of Delta. +Gamma means Delta accelerates as price rises." />
            <GreekCard label="Theta" value={greeks.theta} icon={Hourglass} colorClass={greeks.theta >= 0 ? 'text-green-400' : 'text-tasty-danger'} tooltip="Time decay per day. +Theta benefits from time passing." />
            <GreekCard label="Vega" value={greeks.vega} icon={Sigma} colorClass="text-yellow-400" tooltip="Sensitivity to 1% IV change. +Vega benefits from IV increase." />
          </div>
        );
      };

      // S12: numeric input that keeps what is being typed as text and commits only on blur or Enter
      // (Escape reverts). Before, every keystroke was parsed and applied, so clearing a field to
      // retype it snapped strike to spot, quantity to 1 and model values to 0, repriced the leg,
      // changed its provenance and added an undo step per keystroke. A draft that is not a finite
      // number, or that onCommit rejects by returning false, is not applied: the field shows the
      // last valid value again and is marked invalid until the next edit.
      const isNumericDraft = s => /^[+-]?(\d+\.?\d*|\.\d+)(e[+-]?\d+)?$/i.test(s.trim()) && Number.isFinite(Number(s));
      const NumberField = ({ value, onCommit, className = '', invalidHint = 'Enter a number', ...rest }) => {
        const shown = value == null || Number.isNaN(value) ? '' : String(value);
        const [draft, setDraft] = useState(null);       // null = not editing
        const [invalid, setInvalid] = useState(false);
        const draftRef = useRef(null);
        const setBoth = v => { draftRef.current = v; setDraft(v); };
        const commit = () => {
          const d = draftRef.current;
          setBoth(null);
          if (d === null || d.trim() === shown || d.trim() === '') return; // emptied and left: quietly keep the old value
          if (!isNumericDraft(d) || onCommit(d.trim()) === false) setInvalid(true);
        };
        return (
          <input type="text" inputMode="decimal" autoComplete="off" spellCheck={false} {...rest}
            value={draft ?? shown}
            aria-invalid={invalid || undefined}
            title={invalid ? `${invalidHint}. The previous value was kept.` : rest.title}
            className={`${className} ${invalid ? '!border-red-500' : ''}`}
            onFocus={() => setBoth(shown)}
            onChange={e => { setInvalid(false); setBoth(e.target.value); }}
            onBlur={commit}
            onKeyDown={e => {
              if (e.key === 'Enter') { e.preventDefault(); commit(); }
              else if (e.key === 'Escape') { setBoth(null); setInvalid(false); }
            }} />
        );
      };

      const StrategyBuilder = ({ legs, setLegs, stockPrice, onDeltaHedge, onSave, onSyncChain, chainSyncable, chainLookup, iv30, model, spotProvenance }) => {
        const addLeg = () => {
          const newLeg = {
            id: Math.random().toString(36).substr(2, 9),
            type: OptionType.Call, action: ActionType.Buy, premiumSource:'Theoretical model',
            strike: Math.round(stockPrice), expiry: 30, price: 0, contracts: 1, iv: 30,
          };
          newLeg.price = parseFloat(calculateOptionPrice(stockPrice, newLeg.strike, newLeg.expiry / 365, model.rate, newLeg.iv / 100, newLeg.type, model.dividend).toFixed(2));
          setLegs([...legs, newLeg]);
        };
        const removeLeg = (id) => setLegs(legs.filter((l) => l.id !== id));
        const updateLeg = (id, field, value) => {
          const updated = legs.map((l) => {
            if (l.id !== id) return l;
            let nv = value;
            if (field === 'contracts') { const v = parseFloat(value); nv = isNaN(v) ? 1 : Math.max(0.01, v); }
            else if (field === 'expiry') { const v = parseFloat(value); nv = isNaN(v) ? 0 : Math.max(0, Math.round(v * 100) / 100); } // S7: fractional DTE allowed
            else if (field === 'strike' || field === 'price' || field === 'iv') { const v = parseFloat(value); nv = isNaN(v) ? 0 : Math.max(0, v); }
            if (typeof nv === 'number' && !Number.isFinite(nv)) return l;
            const ul = { ...l, [field]: nv };
            if(field==='price') {ul.premiumSource='Manual';ul.quoteTimestamp=null;}
            else if(['type','strike','expiry','iv'].includes(field)) {ul.premiumSource='Theoretical model';ul.quoteTimestamp=null;}
            if (ul.type !== OptionType.Stock && ul.strike <= 0) ul.strike = Math.max(0.01, Math.round(stockPrice));
            // Stock -> option: restore a usable expiry and IV before pricing (F5).
            if (field === 'type' && ul.type !== OptionType.Stock && l.type === OptionType.Stock) {
              if (!(ul.expiry > 0)) ul.expiry = 30;
              if (!(ul.iv > 0)) ul.iv = iv30 > 0 ? iv30 : 30;
            }
            if (field === 'type' && ul.type === OptionType.Stock) {
              ul.price = stockPrice; ul.strike = 0; ul.expiry = 0; ul.iv = 0;
              // Stock entry is the underlying quote, not a model price (F8).
              Object.assign(ul, spotProvenance ? spotProvenance() : { premiumSource: 'Underlying spot (source unknown)', quoteTimestamp: null });
            } else if (['strike', 'expiry', 'type'].includes(field) && ul.type !== OptionType.Stock && chainLookup) {
              // Exact match in the live chain → real market premium + real IV
              const exact = chainLookup(ul.expiry, ul.strike, ul.type === OptionType.Call);
              if (exact && chainContractPrice(exact) > 0) {
                ul.price = chainContractPrice(exact); ul.premiumSource=exact.premiumSource;ul.quoteTimestamp=exact.quoteTimestamp;
                ul.iv = chainContractIv(exact, stockPrice, ul.expiry, iv30, ul.type === OptionType.Call, model);
              } else {
                ul.price = parseFloat(calculateOptionPrice(stockPrice, ul.strike, ul.expiry / 365, model.rate, ul.iv / 100, ul.type, model.dividend).toFixed(2));
              }
            } else if (['strike', 'expiry', 'type', 'iv'].includes(field) && ul.type !== OptionType.Stock) {
              ul.price = parseFloat(calculateOptionPrice(stockPrice, ul.strike, ul.expiry / 365, model.rate, ul.iv / 100, ul.type, model.dividend).toFixed(2));
            }
            return ul;
          });
          setLegs(updated);
        };
        const totalCost = legs.reduce((acc, leg) => {
          const cost = leg.price * 100 * leg.contracts;
          return leg.action === ActionType.Buy ? acc + cost : acc - cost;
        }, 0);

        return (
          <div className="bg-tasty-panel rounded-lg p-4 sm:p-6 shadow-lg border border-gray-700">
            <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-4">
              <h2 className="text-xl font-bold text-tasty-text flex items-center gap-2">
                <TrendingUp className="text-tasty-accent" /> Strategy Legs
              </h2>
              <div className="flex flex-wrap items-center gap-2">
                {chainSyncable && (
                  <button onClick={onSyncChain} title="Snap strikes to real listed strikes and refresh premiums/IV from the live chain (no extra network calls)"
                    className="flex items-center gap-1.5 px-3 py-1.5 bg-gray-800 hover:bg-gray-700 text-blue-300 border border-blue-500/30 rounded text-xs font-bold uppercase tracking-wider transition-colors">
                    <RefreshCw size={14} /> Sync live
                  </button>
                )}
                <button onClick={onDeltaHedge} className="flex items-center gap-1.5 px-3 py-1.5 bg-gray-800 hover:bg-gray-700 text-blue-400 border border-blue-500/30 rounded text-xs font-bold uppercase tracking-wider transition-colors">
                  <Scale size={14} /> Hedge
                </button>
                <button onClick={onSave} className="flex items-center gap-1.5 px-3 py-1.5 bg-gray-800 hover:bg-gray-700 text-tasty-accent border border-tasty-accent/30 rounded text-xs font-bold uppercase tracking-wider transition-colors">
                  <Save size={14} /> Save
                </button>
                <div className="text-sm bg-gray-900 px-3 py-1.5 rounded border border-gray-700">
                  <span className={`font-mono font-bold ${totalCost > 0 ? 'text-tasty-danger' : 'text-tasty-accent'}`}>
                    {totalCost > 0 ? `Debit $${totalCost.toFixed(2)}` : `Credit $${Math.abs(totalCost).toFixed(2)}`}
                  </span>
                </div>
              </div>
            </div>
            {/* Leg editor layout follows the width of THIS panel (container query), not the window:
                the panel is only ~40% wide on desktop, where a 12-column row left Qty and Price
                about 30px wide. Every field has its own visible label at every size. */}
            <div className="space-y-3 leg-list">
              {legs.map((leg, legIndex) => {
                const isStock = leg.type === OptionType.Stock;
                const field = 'w-full bg-gray-900 border border-gray-700 text-white rounded px-2.5 py-2 text-sm font-mono leg-input';
                const off = isStock ? ' opacity-30 cursor-not-allowed' : '';
                return (
                  <div key={leg.id} className="leg-row bg-tasty-dark p-3 rounded border border-gray-800 hover:border-gray-600 transition-colors">
                    <div className="leg-meta text-xs text-cyan-200 flex flex-wrap justify-between gap-2"><span>{leg.premiumSource || 'Unknown / legacy premium'}{formatStamp(leg.quoteTimestamp) ? ` · ${formatStamp(leg.quoteTimestamp)}` : ' · timestamp unavailable'}</span><button type="button" onClick={()=>setLegs([...legs,{...leg,id:`dup-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 9)}`}])} className="text-violet-300">Duplicate leg</button></div>
                    <label className="leg-field">
                      <span className="leg-label" title="Buy or sell">Action</span>
                      <select aria-label={`Leg ${legIndex + 1} action`} value={leg.action} onChange={(e) => updateLeg(leg.id, 'action', e.target.value)} className={`w-full bg-gray-900 border border-gray-700 rounded px-2 py-2 text-sm font-bold leg-input ${leg.action === ActionType.Buy ? 'text-tasty-accent' : 'text-tasty-danger'}`}>
                        <option value={ActionType.Buy}>BUY</option>
                        <option value={ActionType.Sell}>SELL</option>
                      </select>
                    </label>
                    <label className="leg-field">
                      <span className="leg-label" title="Contracts (options) or 100-share lots (stock)">Qty</span>
                      <NumberField aria-label={`Leg ${legIndex + 1} quantity`} value={leg.contracts} onCommit={(v) => updateLeg(leg.id, 'contracts', v)} className={field} />
                    </label>
                    <label className="leg-field">
                      <span className="leg-label" title="Call, put or stock">Type</span>
                      <select aria-label={`Leg ${legIndex + 1} type`} value={leg.type} onChange={(e) => updateLeg(leg.id, 'type', e.target.value)} className="w-full bg-gray-900 border border-gray-700 text-white rounded px-2 py-2 text-sm leg-input">
                        <option value={OptionType.Call}>CALL</option>
                        <option value={OptionType.Put}>PUT</option>
                        <option value={OptionType.Stock}>STOCK</option>
                      </select>
                    </label>
                    <label className="leg-field">
                      <span className="leg-label" title="Days to expiry">DTE</span>
                      <NumberField aria-label={`Leg ${legIndex + 1} days to expiry`} value={leg.expiry} disabled={isStock} onCommit={(v) => updateLeg(leg.id, 'expiry', v)} className={field + off} />
                    </label>
                    <label className="leg-field">
                      <span className="leg-label" title="Strike price">Strike</span>
                      <NumberField aria-label={`Leg ${legIndex + 1} strike`} value={leg.strike} disabled={isStock} onCommit={(v) => updateLeg(leg.id, 'strike', v)} className={field + off} />
                    </label>
                    <label className="leg-field">
                      <span className="leg-label" title="Implied volatility % used to re-price this leg">IV %</span>
                      <NumberField aria-label={`Leg ${legIndex + 1} IV percent`} value={leg.iv} disabled={isStock} onCommit={(v) => updateLeg(leg.id, 'iv', v)} className={field.replace('text-white', 'text-blue-300') + off} />
                    </label>
                    <div className="leg-field leg-price-cell">
                      <span className="leg-label" title="Entry premium per share">Price</span>
                      <div className="flex items-center gap-1.5">
                        <NumberField aria-label={`Leg ${legIndex + 1} premium`} value={leg.price} onCommit={(v) => updateLeg(leg.id, 'price', v)} className={field} />
                        <button onClick={() => removeLeg(leg.id)} className="flex-shrink-0 text-gray-500 hover:text-red-500 transition-colors p-2 rounded hover:bg-gray-800" title="Remove leg" aria-label={`Remove leg ${legIndex + 1}`}>
                          <Trash2 size={16} />
                        </button>
                      </div>
                    </div>
                  </div>
                );
              })}
            </div>
            <button onClick={addLeg} className="mt-4 w-full py-2 border-2 border-dashed border-gray-700 text-gray-500 hover:border-gray-500 hover:text-white rounded flex items-center justify-center gap-2 transition-all hover:bg-gray-800/50">
              <Plus size={18} /> Add Custom Leg
            </button>
          </div>
        );
      };

      /* ================================================================
         LIVE OPTION CHAIN — from free CBOE delayed feed (all expirations)
         ================================================================ */
      const OptionChainPanel = ({ market, viewChain, onExpChange, onAddLeg, relay, model = DEFAULT_PRICING }) => {
        const [range, setRange] = useState(0.15);
        if (!market || !market.chain) return null;
        const chain = market.chain;
        const spot = market.price;
        const expOptions = chain.expirations.filter((e) => e.dte <= 370);

        const RangeButton = ({ value, label }) => (
          <button onClick={() => setRange(value)}
            className={`px-2 py-0.5 rounded text-[10px] font-bold uppercase tracking-wider border transition-colors ${range === value ? 'bg-tasty-accent text-black border-tasty-accent' : 'bg-gray-900 text-gray-400 border-gray-700 hover:text-white'}`}>
            {label}
          </button>
        );

        const MONEYNESS_LABEL = { itm: 'In the money', atm: 'At the money', otm: 'Out of the money' };
        const LegCell = ({ c, isPut }) => {
          if (!c) return <div className="text-[10px] text-gray-600 text-center">—</div>;
          const m = moneyness(c.strike, spot, isPut); // S10: shading per side, not per row
          // Feed IV, or IV back-solved from the price with the shared rate/dividend (shown with ≈).
          const shownIv = c.iv > 0 ? c.iv
            : impliedVolFromPrice(spot, c.strike, viewChain.dte / 365, model.rate, chainContractPrice(c), !isPut, model.dividend);
          return (
            <button
              onClick={() => onAddLeg(isPut ? OptionType.Put : OptionType.Call, c)}
              data-moneyness={m}
              title={`${MONEYNESS_LABEL[m]} ${isPut ? 'put' : 'call'}. Click to add BUY ${isPut ? 'PUT' : 'CALL'} — bid ${c.bid} / ask ${c.ask} · vol ${c.vol} · OI ${c.oi}\nFlip to SELL in the strategy legs table.`}
              className={`w-full flex items-center justify-between gap-1 ${m === 'itm' ? 'bg-yellow-400/10 border-yellow-500/30' : 'bg-gray-900/60 border-transparent'} hover:bg-tasty-accent/10 border hover:border-tasty-accent/50 rounded px-1.5 py-0.5 transition-colors group text-right`}>
              <span className="font-mono text-[11px] text-tasty-accent">{c.price.toFixed(2)}</span>
              <span className="text-[9px] text-gray-400 group-hover:text-tasty-accent">{c.ivApprox && shownIv != null ? '≈' : ''}{shownIv != null ? `${Math.round(shownIv * 10) / 10}%` : '—'}</span>
              <Plus size={10} className="text-gray-600 group-hover:text-tasty-accent" />
            </button>
          );
        };

        // Build strike rows around spot
        let rowsList = [];
        if (viewChain) {
          const callsByStrike = new Map(viewChain.calls.map((c) => [c.strike, { ...c, ivApprox: !(c.iv > 0) }]));
          const putsByStrike = new Map(viewChain.puts.map((p) => [p.strike, { ...p, ivApprox: !(p.iv > 0) }]));
          const strikes = [...new Set([...callsByStrike.keys(), ...putsByStrike.keys()])]
            .filter((k) => Math.abs(k - spot) / spot <= range)
            .sort((a, b) => Math.abs(a - spot) - Math.abs(b - spot))
            .slice(0, 90)
            .sort((a, b) => a - b);
          rowsList = strikes.map((k) => ({ strike: k, call: callsByStrike.get(k), put: putsByStrike.get(k) }));
        }

        return (
          <div className="bg-tasty-panel rounded-lg border border-gray-700 overflow-hidden">
            <div className="px-4 pt-3 pb-2 flex flex-wrap items-center justify-between gap-2">
              <h3 className="text-gray-300 text-xs font-mono uppercase tracking-wider flex items-center gap-2">
                <List size={14} className="text-tasty-accent" /> Live Option Chain
                <span className="text-[9px] normal-case text-gray-500 font-sans">CBOE delayed · free</span>
              </h3>
              <div className="flex items-center gap-1">
                <RangeButton value={0.05} label="±5%" />
                <RangeButton value={0.15} label="±15%" />
                <RangeButton value={0.3} label="±30%" />
                <RangeButton value={99} label="All" />
              </div>
            </div>
            <div className="px-4 pb-2 flex flex-wrap items-center gap-2 text-xs">
              <select value={viewChain ? viewChain.epoch : ''} onChange={(e) => onExpChange(Number(e.target.value))}
                className="bg-gray-900 border border-gray-700 text-white rounded px-2 py-1 text-xs">
                {expOptions.map((e) => (
                  <option key={e.epoch} value={e.epoch}>
                    {e.dte}d · {new Date(e.epoch * 1000).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: '2-digit', timeZone: 'America/New_York' })}
                  </option>
                ))}
              </select>
              <span className="text-gray-500 text-[10px] font-mono">
                spot ${spot.toFixed(2)} · iv30 {market.iv30 != null ? `${Math.round(market.iv30 * 10) / 10}%` : '—'} · relay: {relay || '—'}
              </span>
            </div>
            <div className="grid grid-cols-12 gap-1 px-3 pb-1 text-[9px] text-gray-500 font-bold uppercase tracking-wider">
              <div className="col-span-4 text-right">Call Mid · IV</div>
              <div className="col-span-4 text-center">Strike</div>
              <div className="col-span-4 text-left">Put Mid · IV</div>
            </div>
            <div className="overflow-y-auto max-h-72 px-3 pb-3 space-y-1">
              {viewChain && rowsList.map(({ strike, call, put }) => (
                <div key={strike} className="grid grid-cols-12 gap-1 items-center rounded">
                  <div className="col-span-4">{call ? <LegCell c={call} isPut={false} /> : <div className="text-[10px] text-gray-600 text-center">—</div>}</div>
                  <div className="col-span-4 text-center font-mono text-xs text-white">{strike.toFixed(strike % 1 === 0 ? 0 : 2)}</div>
                  <div className="col-span-4">{put ? <LegCell c={put} isPut /> : <div className="text-[10px] text-gray-600 text-center">—</div>}</div>
                </div>
              ))}
              {!viewChain && (
                <div className="py-8 text-center text-xs text-gray-500 flex items-center justify-center gap-2">
                  <RefreshCw size={12} className="animate-spin" /> Loading chain…
                </div>
              )}
              {viewChain && rowsList.length === 0 && (
                <div className="py-6 text-center text-xs text-gray-500">No listed strikes near ${spot.toFixed(2)}.</div>
              )}
            </div>
            <div className="border-t border-gray-700 px-4 py-2 text-[10px] text-gray-500 leading-relaxed">
              Click a cell to add a <span className="text-tasty-accent">BUY</span> leg with real bid/ask mid, IV and days-to-expiry — flip to SELL in the legs table.
              Up to ±{range === 99 ? '999' : Math.round(range * 100)}% of spot shown. Shaded cells are in the money: calls below spot, puts above it.
              IV marked ≈ is back-solved from the price with the shared rate and dividend yield when the feed reports none; — means no volatility reproduces the price.
            </div>
          </div>
        );
      };

      const SavedStrategies = ({ strategies, onLoad, onDelete, persist }) => {
        const exportToJSON = (strategy) => {
          const dataStr = 'data:text/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(strategy, null, 2));
          const a = document.createElement('a');
          a.setAttribute('href', dataStr);
          a.setAttribute('download', `${safeFileName(strategy.name)}_${safeFileName(strategy.symbol, 'symbol')}.json`); // D1
          document.body.appendChild(a);
          a.click();
          a.remove();
        };
        return (
          <div>
            {persist && (
              <div className="mb-3 flex items-start gap-2 text-[10px] text-yellow-300/80 bg-yellow-900/20 border border-yellow-700/40 rounded p-2 leading-relaxed">
                <AlertTriangle size={12} className="flex-shrink-0 mt-0.5" />
                <span>Saved strategies are stored UNENCRYPTED in this browser's localStorage. Any script in this origin can read them. Disable persistence in the Charter panel to keep strategies session-only.</span>
              </div>
            )}
            {strategies.length === 0 ? (
              <div className="bg-tasty-panel p-8 rounded-lg border border-gray-800 text-center">
                <Bookmark size={32} className="mx-auto text-gray-600 mb-4" />
                <h3 className="text-gray-400 font-bold">No saved strategies</h3>
                <p className="text-gray-500 text-xs mt-1">Save a multi-leg setup to build your portfolio.</p>
              </div>
            ) : (
              <div className="space-y-4">
                <h3 className="text-gray-400 text-xs font-bold uppercase tracking-wider flex items-center gap-2 px-1">
                  <Bookmark size={14} className="text-yellow-500" /> Saved {persist ? '(persisted)' : '(session only)'}
                </h3>
                <div className="grid grid-cols-1 gap-3">
                  {strategies.map((strategy) => (
                    <div key={strategy.id} className="bg-tasty-panel p-4 rounded-lg border border-gray-700 hover:border-gray-500 transition-all group">
                      <div className="flex justify-between items-start mb-2">
                        <div>
                          <h4 className="font-bold text-white text-sm">{strategy.name}</h4>
                          <div className="flex items-center gap-3 mt-1">
                            <span className="bg-gray-800 text-tasty-accent px-1.5 py-0.5 rounded text-[10px] font-mono font-bold">{strategy.symbol}</span>
                            <span className="text-[10px] text-gray-500 flex items-center gap-1">
                              <Clock size={10} /> {strategy.timestamp ? new Date(strategy.timestamp).toLocaleDateString() : 'Date unknown'}
                            </span>
                          </div>
                        </div>
                        <div className="flex gap-1 hover-reveal">
                          <button onClick={() => exportToJSON(strategy)} className="p-1.5 hover:bg-gray-700 rounded text-gray-400 hover:text-white" title="Export to JSON">
                            <Download size={14} />
                          </button>
                          <button onClick={() => onDelete(strategy.id)} className="p-1.5 hover:bg-gray-700 rounded text-gray-400 hover:text-red-400" title="Delete">
                            <Trash2 size={14} />
                          </button>
                        </div>
                      </div>
                      <div className="flex items-center justify-between mt-3">
                        <div className="text-[10px] text-gray-400 font-mono">
                          {strategy.legs.length} Leg{strategy.legs.length !== 1 ? 's' : ''} • Spot: ${strategy.underlyingPrice.toFixed(2)}
                        </div>
                        <button onClick={() => onLoad(strategy)} className="flex items-center gap-1.5 px-3 py-1 bg-tasty-accent hover:bg-tasty-accent/90 text-black text-[10px] font-bold uppercase rounded transition-colors">
                          <ExternalLink size={10} /> Load Strategy
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </div>
        );
      };

      /* ================================================================
         MAIN APP
         ================================================================ */
      const App = () => {
        // --- Core state ---
        const [symbol, setSymbol] = useState('SPY');
        const [draftSymbol,setDraftSymbol]=useState('SPY');
        const [underlyingSource,setUnderlyingSource]=useState('Illustrative demo');
        const requestVersion=useRef(0);
        const invalidateQuote=()=>{requestVersion.current++;setMarketLoading(false);};
        const [currentPrice, setCurrentPrice] = useState(450);
        const [iv, setIv] = useState(20);
        const [model,setModel]=useState({rate:.05,dividend:0,commission:0,stockCommission:0,slippage:0});
        const [rawLegs,setRawLegs]=useState([]);
        const [history,setHistory]=useState([]);
        const legs=useMemo(()=>rawLegs.map(l=>({...l,model})),[rawLegs,model]);
        // S5: the undo history reads the CURRENT legs from a ref. The old version captured `rawLegs`
        // from the render that created the handler, so async callers (the startup fetch) pushed a
        // stale snapshot and functional updates ran against stale state.
        const rawLegsRef=useRef([]);
        const commitLegs=value=>{rawLegsRef.current=value;setRawLegs(value);setCodeVerified(false);};
        const setLegs=next=>{const prev=rawLegsRef.current;const value=typeof next==='function'?next(prev):next;if(value===prev)return;
          setHistory(h=>[...h.slice(-29),prev]);commitLegs(value);};
        // Replaces the legs without an undo entry and clears history (startup build, ticker change, load).
        const replaceLegs=value=>{setHistory([]);commitLegs(value);};
        const undo=()=>{if(history.length){commitLegs(history[history.length-1]);setHistory(history.slice(0,-1));setStrategyType(StrategyTemplate.Custom);}};
        const [compareSnapshot,setCompareSnapshot]=useState(null);
        const [strategyType, setStrategyType] = useState(StrategyTemplate.Custom);
        const [isLoading, setIsLoading] = useState(false);
        const [generatedCode, setGeneratedCode] = useState('');
        const [showCode, setShowCode] = useState(false);
        const [savedStrategies, setSavedStrategies] = useState([]);

        // --- Governance state (Step 1, 4, 9, 12, 13) ---
        const [externalCallsEnabled, setExternalCallsEnabled] = useState(false);
        // S4: counts come from reportExternalCall, i.e. from requests actually sent.
        const [callStats, setCallStats] = useState({ data: 0, dataFailed: 0, llm: 0, llmFailed: 0 });
        useEffect(() => {
          const onCall = (kind, ok) => setCallStats(s => kind === 'llm'
            ? { ...s, llm: s.llm + 1, llmFailed: s.llmFailed + (ok ? 0 : 1) }
            : { ...s, data: s.data + 1, dataFailed: s.dataFailed + (ok ? 0 : 1) });
          externalCallListeners.add(onCall);
          return () => externalCallListeners.delete(onCall);
        }, []);
        const [pendingVerification, setPendingVerification] = useState(null);
        const [governanceOpen, setGovernanceOpen] = useState(false);
        const [persistStrategies, setPersistStrategies] = useState(false);
        const [codeVerified, setCodeVerified] = useState(false);
        const [storageNotice, setStorageNotice] = useState(null);
        const [loadNotice, setLoadNotice] = useState(null);

        // --- Live data state (free Yahoo Finance + CBOE, no API key) ---
        const [market, setMarket] = useState(null);
        const marketRef = useRef(null);
        const [marketLoading, setMarketLoading] = useState(false);
        const [marketError, setMarketError] = useState(null);
        const [lastUpdated, setLastUpdated] = useState(null);
        const [dataRelay, setDataRelay] = useState(null);
        const [selectedExpiryEpoch, setSelectedExpiryEpoch] = useState(null);
        const fetchInFlightRef = useRef(false);
        const previousSymbolRef = useRef(null);

        // Chain slice visible in the panel (walks the cached per-expiration tables)
        const viewChain = useMemo(() => {
          if (!market || !market.chain) return null;
          const exps = market.chain.expirations;
          if (!exps.length) return null;
          const ep = selectedExpiryEpoch != null && market.chain.chains[selectedExpiryEpoch]
            ? selectedExpiryEpoch
            : findChainExpiryForDte(market, 45).epoch;
          const rows = market.chain.chains[ep];
          if (!rows) return null;
          const date = exps.find((e) => e.epoch === ep) || { epoch: ep, dte: dteFromExpiry(ep * 1000) };
          return { epoch: ep, dte: date.dte, calls: rows.calls, puts: rows.puts };
        }, [market, selectedExpiryEpoch]);

        // --- Persistence (Step 9 — opt-in only) ---
        const storageReady = useRef(false);
        useEffect(() => {
          storageReady.current = false;
          if (!persistStrategies) return;
          let stored;
          try { stored = localStorage.getItem(STORAGE_KEY); } catch (e) { console.warn('Storage unavailable', e); return; }
          if (stored) {
            const { valid, rejected, needsBackup } = parseStoredStrategies(stored);
            if (needsBackup) {
              // Keep the untouched original before the save effect rewrites the main key.
              try { localStorage.setItem(STORAGE_BACKUP_KEY, stored); } catch (e) { console.error('Failed to back up saved strategies', e); }
              setStorageNotice(rejected
                ? `${rejected} saved ${rejected === 1 ? 'strategy was' : 'strategies were'} invalid and not loaded. The original data was copied to localStorage key "${STORAGE_BACKUP_KEY}".`
                : `Saved strategies could not be read. The original data was copied to localStorage key "${STORAGE_BACKUP_KEY}".`);
            }
            if (valid.length > 0) {
              // Merge: keep strategies saved earlier this session, add stored ones not already present.
              setSavedStrategies(prev => { const ids = new Set(prev.map(s => s.id)); return [...prev, ...valid.filter(s => !ids.has(s.id))]; });
              return;
            }
          }
          storageReady.current = true;
        }, [persistStrategies]);

        useEffect(() => {
          if (!persistStrategies) return;
          if (!storageReady.current) { storageReady.current = true; return; }
          try { localStorage.setItem(STORAGE_KEY, JSON.stringify(savedStrategies)); }
          catch (e) { console.error('Failed to persist strategies', e); }
        }, [savedStrategies, persistStrategies]);

        // Initial market load happens below, after handlers are defined.

        // Provenance for a stock entry price: it is the underlying quote (F8). marketRef is set
        // before rebuilds and cleared on manual/LLM/saved prices, so it is current even in async flows.
        const spotProvenance = () => {
          const m = marketRef.current;
          return m ? { premiumSource: `Underlying: ${m.source}`, quoteTimestamp: m.quoteTimestamp ?? null }
            : { premiumSource: `Underlying: ${underlyingSource}`, quoteTimestamp: null };
        };

        const applyStrategy = async (type, stockPrice, currentIv) => {
          setStrategyType(type);
          setLoadNotice(null); // a rebuilt strategy is no longer the loaded one
          const newLegs = [];
          const id = () => Math.random().toString(36).substr(2, 9);
          const dte = 45;
          const s = (v) => parseFloat(v.toFixed(2));
          const getPrice = (strike, expiry, optType) => {
            if (optType === OptionType.Stock) return stockPrice;
            return parseFloat(calculateOptionPrice(stockPrice, strike, expiry / 365, model.rate, currentIv / 100, optType, model.dividend).toFixed(2));
          };
          const L = (partial) => ({ id: id(), contracts: 1, iv: currentIv, premiumSource:'Theoretical model', ...partial });

          switch (type) {
            case StrategyTemplate.CoveredCall:
              newLegs.push(
                L({ type: OptionType.Stock, action: ActionType.Buy, strike: 0, expiry: 0, price: stockPrice, iv: 0, ...spotProvenance() }),
                L({ type: OptionType.Call, action: ActionType.Sell, strike: s(stockPrice * 1.05), expiry: dte, price: getPrice(s(stockPrice * 1.05), dte, OptionType.Call) })
              );
              break;
            case StrategyTemplate.ProtectivePut:
              newLegs.push(
                L({ type: OptionType.Stock, action: ActionType.Buy, strike: 0, expiry: 0, price: stockPrice, iv: 0, ...spotProvenance() }),
                L({ type: OptionType.Put, action: ActionType.Buy, strike: s(stockPrice * 0.95), expiry: dte, price: getPrice(s(stockPrice * 0.95), dte, OptionType.Put) })
              );
              break;
            case StrategyTemplate.PoorMansCoveredCall:
              newLegs.push(
                L({ type: OptionType.Call, action: ActionType.Buy, strike: s(stockPrice * 0.8), expiry: 120, price: getPrice(s(stockPrice * 0.8), 120, OptionType.Call) }),
                L({ type: OptionType.Call, action: ActionType.Sell, strike: s(stockPrice * 1.05), expiry: 30, price: getPrice(s(stockPrice * 1.05), 30, OptionType.Call) })
              );
              break;
            case StrategyTemplate.CalendarCall:
              newLegs.push(
                L({ type: OptionType.Call, action: ActionType.Sell, strike: s(stockPrice), expiry: 30, price: getPrice(s(stockPrice), 30, OptionType.Call) }),
                L({ type: OptionType.Call, action: ActionType.Buy, strike: s(stockPrice), expiry: 60, price: getPrice(s(stockPrice), 60, OptionType.Call) })
              );
              break;
            case StrategyTemplate.CalendarPut:
              newLegs.push(
                L({ type: OptionType.Put, action: ActionType.Sell, strike: s(stockPrice), expiry: 30, price: getPrice(s(stockPrice), 30, OptionType.Put) }),
                L({ type: OptionType.Put, action: ActionType.Buy, strike: s(stockPrice), expiry: 60, price: getPrice(s(stockPrice), 60, OptionType.Put) })
              );
              break;
            case StrategyTemplate.JadeLizard:
              newLegs.push(
                L({ type: OptionType.Put, action: ActionType.Sell, strike: s(stockPrice * 0.9), expiry: dte, price: getPrice(s(stockPrice * 0.9), dte, OptionType.Put) }),
                L({ type: OptionType.Call, action: ActionType.Sell, strike: s(stockPrice * 1.05), expiry: dte, price: getPrice(s(stockPrice * 1.05), dte, OptionType.Call) }),
                L({ type: OptionType.Call, action: ActionType.Buy, strike: s(stockPrice * 1.1), expiry: dte, price: getPrice(s(stockPrice * 1.1), dte, OptionType.Call) })
              );
              break;
            case StrategyTemplate.IronCondor:
              newLegs.push(
                L({ type: OptionType.Put, action: ActionType.Buy, strike: s(stockPrice * 0.9), expiry: dte, price: getPrice(s(stockPrice * 0.9), dte, OptionType.Put) }),
                L({ type: OptionType.Put, action: ActionType.Sell, strike: s(stockPrice * 0.95), expiry: dte, price: getPrice(s(stockPrice * 0.95), dte, OptionType.Put) }),
                L({ type: OptionType.Call, action: ActionType.Sell, strike: s(stockPrice * 1.05), expiry: dte, price: getPrice(s(stockPrice * 1.05), dte, OptionType.Call) }),
                L({ type: OptionType.Call, action: ActionType.Buy, strike: s(stockPrice * 1.1), expiry: dte, price: getPrice(s(stockPrice * 1.1), dte, OptionType.Call) })
              );
              break;
            case StrategyTemplate.IronButterfly:
              newLegs.push(
                L({ type: OptionType.Put, action: ActionType.Buy, strike: s(stockPrice * 0.95), expiry: dte, price: getPrice(s(stockPrice * 0.95), dte, OptionType.Put) }),
                L({ type: OptionType.Put, action: ActionType.Sell, strike: s(stockPrice), expiry: dte, price: getPrice(s(stockPrice), dte, OptionType.Put) }),
                L({ type: OptionType.Call, action: ActionType.Sell, strike: s(stockPrice), expiry: dte, price: getPrice(s(stockPrice), dte, OptionType.Call) }),
                L({ type: OptionType.Call, action: ActionType.Buy, strike: s(stockPrice * 1.05), expiry: dte, price: getPrice(s(stockPrice * 1.05), dte, OptionType.Call) })
              );
              break;
            case StrategyTemplate.VerticalSpreadDebit:
              newLegs.push(
                L({ type: OptionType.Call, action: ActionType.Buy, strike: s(stockPrice), expiry: dte, price: getPrice(s(stockPrice), dte, OptionType.Call) }),
                L({ type: OptionType.Call, action: ActionType.Sell, strike: s(stockPrice * 1.05), expiry: dte, price: getPrice(s(stockPrice * 1.05), dte, OptionType.Call) })
              );
              break;
            case StrategyTemplate.VerticalSpreadCredit:
              newLegs.push(
                L({ type: OptionType.Put, action: ActionType.Sell, strike: s(stockPrice), expiry: dte, price: getPrice(s(stockPrice), dte, OptionType.Put) }),
                L({ type: OptionType.Put, action: ActionType.Buy, strike: s(stockPrice * 0.95), expiry: dte, price: getPrice(s(stockPrice * 0.95), dte, OptionType.Put) })
              );
              break;
            case StrategyTemplate.Straddle:
              newLegs.push(
                L({ type: OptionType.Call, action: ActionType.Buy, strike: s(stockPrice), expiry: dte, price: getPrice(s(stockPrice), dte, OptionType.Call) }),
                L({ type: OptionType.Put, action: ActionType.Buy, strike: s(stockPrice), expiry: dte, price: getPrice(s(stockPrice), dte, OptionType.Put) })
              );
              break;
            case StrategyTemplate.Strangle:
              newLegs.push(
                L({ type: OptionType.Call, action: ActionType.Buy, strike: s(stockPrice * 1.05), expiry: dte, price: getPrice(s(stockPrice * 1.05), dte, OptionType.Call) }),
                L({ type: OptionType.Put, action: ActionType.Buy, strike: s(stockPrice * 0.95), expiry: dte, price: getPrice(s(stockPrice * 0.95), dte, OptionType.Put) })
              );
              break;
            default:
              newLegs.push(L({ type: OptionType.Call, action: ActionType.Buy, strike: s(stockPrice), expiry: dte, price: getPrice(s(stockPrice), dte, OptionType.Call) }));
          }
          // BS-model legs render instantly, then any leg with a real listed contract
          // in the live chain is upgraded to real strikes, premiums and IVs.
          await enrichLegsFromChain(newLegs,marketRef.current?.symbol || symbol);
        };

        // --- LIVE CHAIN ENRICHMENT (uses cached CBOE chain — no extra requests) ---
        const enrichLegsFromChain = async (baseLegs,expectedSymbol=symbol) => {
          const mkt = marketRef.current;
          const chain = mkt && mkt.symbol === expectedSymbol ? mkt.chain : null;
          if (!chain || !chain.expirations.length) { setLegs(baseLegs); return; }
          try {
            const spot = mkt.price;
            const enriched = baseLegs.map((leg) => {
              if (leg.type === OptionType.Stock) return leg; // Preserve stock entry cost.
              const exp = findChainExpiryForDte(mkt, leg.expiry);
              const rows = exp ? chain.chains[exp.epoch] : null;
              const side = leg.type === OptionType.Call ? 'calls' : 'puts';
              if (!rows || !rows[side] || rows[side].length === 0) return leg;
              const arr = rows[side];
              const strike = snapToNearest(arr.map((r) => r.strike), leg.strike);
              const contract = arr.find((r) => r.strike === strike);
              if (!contract) return leg;
              const isCall = leg.type === OptionType.Call;
              const quoted = chainContractPrice(contract);
              if (quoted > 0) {
                return { ...leg, strike, expiry: exp.dte, price: quoted,
                  premiumSource: contract.premiumSource, quoteTimestamp: contract.quoteTimestamp,
                  iv: chainContractIv(contract, spot, exp.dte, chain.iv30, isCall, model) };
              }
              // S8: listed contract but no usable quote. Keep the snapped strike and expiry, and price
              // THAT contract with the model (feed IV if present, else the leg's IV), so price, strike,
              // expiry and label all describe the same thing. No chain timestamp is attached.
              const iv = contract.iv > 0 ? contract.iv : leg.iv;
              return { ...leg, strike, expiry: exp.dte, iv,
                price: parseFloat(calculateOptionPrice(spot, strike, exp.dte / 365, model.rate, iv / 100, leg.type, model.dividend).toFixed(2)),
                premiumSource: 'Theoretical model (listed contract had no quote)', quoteTimestamp: null };
            });
            setLegs(enriched);
          } catch (e) {
            console.error('Chain enrichment failed', e);
            setLegs(baseLegs);
          }
        };

        const chainLookup = (dteTarget, strike, isCall) => {
          const mkt = marketRef.current;
          if (!mkt || mkt.symbol !== symbol || !mkt.chain) return null;
          const exp = findChainExpiryForDte(mkt, dteTarget);
          if (!exp || exp.dte !== dteTarget) return null;
          const rows = exp ? mkt.chain.chains[exp.epoch] : null;
          const side = isCall ? 'calls' : 'puts';
          if (!rows || !rows[side]) return null;
          return rows[side].find((r) => Math.abs(r.strike - strike) < 1e-6) || null;
        };

        const syncLegsToChain = async () => {
          if (legs.length === 0) return;
          await enrichLegsFromChain(legs.map((l) => ({ ...l })));
          const mkt = marketRef.current;
          if (mkt && mkt.chain) setLastUpdated(new Date(mkt.fetchedAt));
        };

        const addChainLeg = (optType, contract) => {
          const mkt = marketRef.current;
          if (!mkt || !viewChain || mkt.symbol!==symbol) return;
          if (!(chainContractPrice(contract)>0)) {alert('No usable premium. Add a custom leg and enter a price.');return;}
          setLegs((prev) => [...prev, {
            id: Math.random().toString(36).substr(2, 9),
            type: optType, action: ActionType.Buy,
            strike: contract.strike, expiry: viewChain.dte, premiumSource:contract.premiumSource, quoteTimestamp:contract.quoteTimestamp,
            price: (() => { const p = chainContractPrice(contract); return p > 0 ? p : 1; })(),
            contracts: 1,
            iv: chainContractIv(contract, mkt.price, viewChain.dte, mkt.chain.iv30, optType === OptionType.Call, model),
          }]);
          setStrategyType(StrategyTemplate.Custom);
        };

        // --- FREE LIVE FETCH (Yahoo quote + CBOE chain) ---
        const handleYahooFetch = async (symArg, opts = {}) => {
          const sym = String(symArg != null ? symArg : draftSymbol).trim().toUpperCase();
          if (!sym) return;
          if (!/^[A-Z0-9.^/-]{1,20}$/.test(sym)) { setMarketError('Invalid ticker'); return; }
          const ticket=++requestVersion.current;
          setMarketLoading(true);
          setMarketError(null);
          try {
            const data = await getTradeData(sym, { maxAgeMs: 45000, onNote: (n) => console.warn(n) });
            if (ticket!==requestVersion.current) return;
            // S13: name the relay each part actually came through; a cache hit says so.
            setDataRelay(data.relays ? [data.relays.quote && `quote ${data.relays.quote}`, data.relays.chain && `chain ${data.relays.chain}`].filter(Boolean).join(' · ') + (data.fromCache ? ' (cached)' : '') : null);
            const chain = (data.chain && data.chain.expirations.length > 0) ? data.chain : null;
            const mkt = {
              symbol: sym,
              name: data.quote ? data.quote.name : sym,
              price: data.price,
              prevClose: (data.quote && data.quote.prevClose != null) ? data.quote.prevClose : (data.chain ? data.chain.prevClose : null),
              iv30: chain ? chain.iv30 : null,
              asOf: chain ? chain.asOf : null,
              quoteTimestamp:data.quote?.timestamp || (chain?.asOf || null),
              source:data.quote?.source || 'CBOE underlying', delay:data.quote?.delay ?? null,
              chain,
              fetchedAt: data.fetchedAt,
            };
            marketRef.current = mkt;
            setMarket(mkt);
            setSymbol(sym); setDraftSymbol(sym);setUnderlyingSource(mkt.source);
            setCurrentPrice(mkt.price);
            setLastUpdated(new Date(data.fetchedAt));
            const symbolChanged = opts.forceRebuild === true || sym !== (previousSymbolRef.current || symbol);
            previousSymbolRef.current = sym;
            let liveIv = iv;
            if (chain) {
              const atm = atmIvFromChain(mkt, mkt.price, 30, sym);
              liveIv = atm != null ? Math.round(atm * 10) / 10 : (chain.iv30 != null ? Math.round(chain.iv30 * 10) / 10 : iv);
              setSelectedExpiryEpoch(findChainExpiryForDte(mkt, 45).epoch);
            }
            setIv(liveIv);
            if (opts.rebuild || symbolChanged) {
              await applyStrategy(opts.rebuild ? (opts.template || strategyType) : strategyType, mkt.price, liveIv);
              // S5: an automatic rebuild (new ticker or the startup build) is not an undoable edit.
              if(symbolChanged || opts.rebuild)setHistory([]);
            }
          } catch (e) {
            if(ticket!==requestVersion.current)return;
            setMarketError(`Live fetch failed: ${String(e.message || e).slice(0, 240)} — press refresh to retry, or use Manual entry to set a price without network calls.`);
          } finally {
            if(ticket===requestVersion.current) setMarketLoading(false);
          }
        };

        // --- Initial auto-load: free live data for SPY, then build the demo at real prices ---
        useEffect(() => {
          // S5: the placeholder build at $450 is not an undoable edit either.
          applyStrategy(StrategyTemplate.IronCondor, 450, 20).then(() => setHistory([]));
          handleYahooFetch('SPY', { rebuild: true, template: StrategyTemplate.IronCondor });
          // eslint-disable-next-line react-hooks/exhaustive-deps
        }, []);

        // --- STEP 4, 6, 3 — Governed fetch flow ---
        const handleFetchData = async () => {
          if (!externalCallsEnabled) {
            alert('External LLM calls are disabled (kill switch ON).\n\nEnable them in the Governance panel (Shield icon) to use this feature.\n\nAlternatively, click "Manual" to set the price yourself.');
            return;
          }
          if (!isExternalConfigured()) {
            alert('No LLM endpoint configured.\n\nEither:\n  • Set window.GEMINI_PROXY_URL to a server-side proxy (recommended), or\n  • Set window.GEMINI_API_KEY for local experiments only.\n\nOr use the "Manual" button to set the price without external calls.');
            return;
          }
          setIsLoading(true);
          // S6: remember what the suggestion would replace. Typing in the ticker box no longer
          // cancels it; only a change to the active underlying (symbol, price or feed) makes it stale,
          // and that is shown in the dialog instead of the result silently disappearing.
          const basis = { symbol, price: currentPrice, fetchedAt: marketRef.current?.fetchedAt ?? null };
          const result = await fetchStockPriceDetailed(symbol);
          if (!result.ok) {
            setIsLoading(false);
            alert(`Fetch failed: ${result.reason}. No price was updated.`);
            return;
          }
          const validation = validateFetchResult(result, symbol, currentPrice, iv);
          setPendingVerification({ result, validation, symbol, basis });
          setIsLoading(false);
        };
        const verificationStale = verificationStaleReason(pendingVerification,
          { symbol, price: currentPrice, fetchedAt: market?.fetchedAt ?? null });

        const acceptVerifiedPrice = (price, ivVal) => {
          if (verificationStale) {
            alert(`Not applied: ${verificationStale} Request a new AI price for the current underlying if you still need one.`);
            setPendingVerification(null);
            return;
          }
          invalidateQuote(); marketRef.current=null;setMarket(null);setLastUpdated(null);
          setCurrentPrice(price);setUnderlyingSource('Human-verified LLM suggestion (not market feed)');
          setIv(ivVal);
          setPendingVerification(null);
        };

        const rejectVerification = () => {
          setPendingVerification(null);
        };

        const handleManualPrice = () => {
          const v = window.prompt(`Enter current price for ${symbol} (manual entry, no external call):`, currentPrice.toString());
          if (v === null) return;
          const num = v.trim() === '' ? NaN : Number(v);
          if (!isFinite(num) || num <= 0 || num > 100000) {
            alert('Invalid price. Must be a positive number under $100,000.');
            return;
          }
          invalidateQuote(); marketRef.current=null;setMarket(null);setLastUpdated(null);
          setCurrentPrice(num);setUnderlyingSource('Manual underlying');
        };

        // --- STEP 6 — Code generation also gates through human verification ---
        const handleGenerateCode = async () => {
          if (!externalCallsEnabled) {
            alert('External LLM calls are disabled (kill switch ON). Enable them in the Governance panel.');
            return;
          }
          if (!isExternalConfigured()) {
            alert('No LLM endpoint configured.');
            return;
          }
          setIsLoading(true);
          const code = await generatePythonCode(legs, symbol, currentPrice);
          setGeneratedCode(code);
          setShowCode(true);
          setCodeVerified(false);
          setIsLoading(false);
        };

        const handleDeltaHedge = () => {
          const greeks = getStrategyGreeks(legs, currentPrice);
          if (Math.abs(greeks.delta) < 1) {
            alert('Strategy is already approximately delta neutral.');
            return;
          }
          const req = -1 * (greeks.delta / 100);
          setLegs([...legs, {
            id: Math.random().toString(36).substr(2, 9),
            type: OptionType.Stock,
            action: req > 0 ? ActionType.Buy : ActionType.Sell,
            strike: 0, expiry: 0,
            contracts: parseFloat(Math.abs(req).toFixed(2)),
            price: currentPrice, iv: 0, ...spotProvenance(),
          }]);
          setStrategyType(StrategyTemplate.Custom);
        };

        const saveCurrentStrategy = () => {
          const savedAt = Date.now();
          const record = {
            id: Math.random().toString(36).substr(2, 9),
            symbol, timestamp: savedAt,
            legs: stampExpiryDates(JSON.parse(JSON.stringify(legs)), savedAt), // S1: absolute expiry per leg
            underlyingPrice: currentPrice, underlyingIv: iv, model,
          };
          // Reject anything the loader/importer would reject, so persisted data always reloads.
          try { validateStrategyImport({ ...record, name: 'check' }); }
          catch (e) { alert(`Cannot save this strategy: ${e.message}. Saved strategies need 1–40 legs and values within the import limits.`); return; }
          const name = window.prompt('Enter a name for this strategy:', `${strategyType} on ${symbol}`);
          if (!name) return;
          setSavedStrategies((prev) => [{ ...record, name }, ...prev]);
        };

        const loadSavedStrategy = (saved) => {
          marketRef.current = null;
          setMarket(null);
          setSelectedExpiryEpoch(null);
          setLastUpdated(null);
          invalidateQuote(); setDraftSymbol(saved.symbol);
          // Record the loaded symbol so a later refresh of the same ticker keeps these legs.
          previousSymbolRef.current = saved.symbol;
          setSymbol(saved.symbol);
          setCurrentPrice(saved.underlyingPrice);
          setIv(saved.underlyingIv);
          if(saved.model)setModel({...model,...saved.model});
          // S1: bring days-to-expiry forward to today; entry premiums stay as saved.
          const aging = ageSavedLegs(saved.legs, saved.timestamp);
          setLoadNotice(describeAging(aging, saved.timestamp));
          replaceLegs(aging.legs);setUnderlyingSource('Saved / imported underlying');
          setStrategyType(StrategyTemplate.Custom);
          window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        const deleteSavedStrategy = (id) => {
          if (window.confirm('Delete this saved strategy?')) {
            setSavedStrategies((prev) => prev.filter((s) => s.id !== id));
          }
        };

        const importStrategy=async event=>{
          const file=event.target.files?.[0];event.target.value='';if(!file)return;
          try{if(file.size>1024*1024)throw Error('File exceeds 1 MB');
            const saved=validateStrategyImport(JSON.parse(await file.text()));loadSavedStrategy(saved);
          }catch(e){alert(`Import rejected: ${e.message}`);}
        };
        // Reference P/L at spot (used for code verification)
        const referenceAtExpiry = useMemo(() => {
          if (legs.length === 0) return null;
          const options = legs.filter(l => l.type !== OptionType.Stock);
          const horizon = options.length ? Math.min(...options.map(l => l.expiry)) : 0;
          return legs.reduce((acc, leg) => acc + calculateLegProfit(leg, currentPrice, horizon, 0), 0);
        }, [legs, currentPrice]);

        return (
          <div className="min-h-screen bg-black text-gray-200 font-sans selection:bg-tasty-accent selection:text-black">
            {/* M3: sticky only from md up; on phones the ~140px header would cover a sixth of the screen. */}
            <header className="border-b border-gray-800 bg-tasty-dark p-4 md:sticky md:top-0 z-40 shadow-md">
              <div className="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
                <div className="flex items-center gap-3">
                  <div className="bg-tasty-accent p-2 rounded-lg text-black"><LineChart size={24} /></div>
                  <div className="flex flex-col md:flex-row md:items-baseline md:gap-3">
                    <h1 className="text-2xl font-bold tracking-tight text-white">
                      OptionStrat <span className="text-tasty-accent">Pro</span>
                    </h1>
                    <span className="text-xs font-mono font-bold text-pink-500 tracking-wider" style={{ textShadow: '0 0 10px rgba(236, 72, 153, 0.7)' }}>
                      governed edition
                    </span>
                    {/* M2: the desktop price block is hidden below md, so show a compact price here. */}
                    <span className="md:hidden text-xs font-mono text-gray-400" aria-label="Current underlying price">
                      {symbol} <span className="text-tasty-accent font-bold">${currentPrice.toFixed(2)}</span>
                      {marketError ? <span className="text-red-400"> · data error</span> : null}
                    </span>
                  </div>
                </div>
                <div className="flex items-center gap-3 w-full md:w-auto">
                  {/* Kill switch indicator */}
                  <button
                    onClick={() => setExternalCallsEnabled(!externalCallsEnabled)}
                    className={`flex items-center gap-1.5 px-3 py-2 rounded-lg border text-xs font-bold uppercase tracking-wider transition-colors ${externalCallsEnabled ? 'bg-tasty-accent/10 text-tasty-accent border-tasty-accent/40 hover:bg-tasty-accent/20' : 'bg-gray-900 text-gray-500 border-gray-700 hover:bg-gray-800'}`}
                    title="Kill switch for external LLM calls"
                  >
                    {externalCallsEnabled ? <Shield size={16} /> : <ShieldOff size={16} />}
                    <span className="hidden md:inline">{externalCallsEnabled ? 'LLM On' : 'LLM Off'}</span>
                  </button>
                  <button
                    onClick={() => setGovernanceOpen(true)}
                    className="flex items-center gap-1.5 px-3 py-2 rounded-lg bg-gray-800 hover:bg-gray-700 border border-gray-700 text-gray-300 text-xs font-bold uppercase tracking-wider transition-colors"
                    title="Governance panel"
                  >
                    <BookOpen size={16} />
                    <span className="hidden md:inline">Charter</span>
                  </button>
                  <div className="relative flex-1 md:w-48">
                    <input type="text" aria-label="Ticker to fetch" value={draftSymbol} onChange={(e) => {invalidateQuote();setDraftSymbol(e.target.value.toUpperCase());}}
                      onKeyDown={(e) => { if (e.key === 'Enter') handleYahooFetch(); }}
                      className="w-full bg-gray-900 border border-gray-700 rounded-lg py-2 pl-10 pr-4 text-white focus:outline-none focus:border-tasty-accent transition-colors"
                      placeholder="Symbol (Enter = fetch)" />
                    <Search className="absolute left-3 top-2.5 text-gray-500" size={18} />
                  </div>
                  <button onClick={() => handleYahooFetch()} disabled={marketLoading || isLoading}
                    className="bg-tasty-accent/90 hover:bg-tasty-accent text-black px-3 py-2 rounded-lg flex items-center gap-2 border border-tasty-accent/50 transition-all active:scale-95 disabled:opacity-50"
                    title="Refresh free live quote + option chain (Yahoo Finance + CBOE, no API key)">
                    <RefreshCw size={18} className={marketLoading || isLoading ? 'animate-spin' : ''} />
                  </button>
                  {externalCallsEnabled && (
                    <button onClick={handleFetchData} disabled={isLoading || marketLoading}
                      className="bg-gray-800 hover:bg-gray-700 text-purple-300 px-3 py-2 rounded-lg flex items-center gap-2 border border-purple-700/40 transition-all active:scale-95 disabled:opacity-50 text-xs font-bold uppercase tracking-wider"
                      title="Optional: fetch price via LLM web search (requires human verification)">
                      <Sparkles size={16} className={isLoading ? 'animate-pulse' : ''} />
                      <span className="hidden md:inline">AI</span>
                    </button>
                  )}
                  <button onClick={handleManualPrice}
                    className="bg-gray-800 hover:bg-gray-700 text-blue-400 px-3 py-2 rounded-lg flex items-center gap-2 border border-blue-700/40 transition-all active:scale-95 text-xs font-bold uppercase tracking-wider"
                    title="Set price manually (no external call)">
                    <Edit3 size={16} />
                  </button>
                  <div className="hidden md:flex flex-col text-xs text-right">
                    <span className="text-gray-400">{market && market.name ? `${symbol} · ${market.name}` : 'Price'}</span>
                    <span className="font-mono text-tasty-accent text-lg">${currentPrice.toFixed(2)}</span>
                    <span className="text-[10px] text-gray-500 font-mono">
                      {marketError
                        ? <span className="text-red-400">data error</span>
                        : market
                          ? <>{market.source || 'Quote'}{market.chain ? ' + CBOE chain (delayed)' : ''}{lastUpdated ? ` · retrieved ${lastUpdated.toLocaleTimeString()}` : ''}</>
                          : underlyingSource}
                    </span>
                  </div>
                </div>
              </div>
            </header>

            <CharterBanner onOpen={() => setGovernanceOpen(true)} />

            <main className="max-w-7xl mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6">
              <div className="lg:col-span-5 space-y-6">
                <div className="bg-tasty-panel p-4 rounded-lg border border-gray-700">
                  <label className="text-gray-400 text-xs font-bold uppercase tracking-wider mb-2 block">Strategy Template</label>
                  <select value={strategyType} onChange={(e) => applyStrategy(e.target.value, currentPrice, iv)}
                    className="w-full bg-gray-900 border border-gray-600 text-white rounded p-3 focus:border-tasty-accent outline-none">
                    {Object.values(StrategyTemplate).map((t) => (
                      <option key={t} value={t}>{t}</option>
                    ))}
                  </select>
                </div>

                <section className="lab-panel text-xs space-y-2" aria-label="Data provenance"><p className="lab-kicker">Active strategy · {symbol}</p>
                  <p>Underlying source: {market?.source || underlyingSource}</p>
                  <p>Quote timestamp: {formatStamp(market?.quoteTimestamp) || 'Unavailable'}</p>
                  <p>Reported delay: {market?.delay!=null ? `${market.delay} minutes` : 'Unknown — do not assume real time'}</p>
                  <p>Retrieved: {formatStamp(market?.fetchedAt) || 'No active feed'}</p>
                  <p>Chain timestamp: {formatStamp(market?.asOf) || 'Unavailable'} · CBOE delayed feed, sent as US Eastern time and shown here in your time zone; relayed values require verification.</p>
                  {loadNotice && <p className="text-amber-300" role="status">{loadNotice}</p>}
                  {draftSymbol!==symbol && <p className="text-amber-300">Ticker {draftSymbol || '(empty)'} is not active until a successful fetch. Current legs remain {symbol}.</p>}
                </section>
                <section className="lab-panel"><p className="lab-kicker">Shared pricing & costs</p><div className="grid grid-cols-2 gap-3 mt-3">
                  {[['rate','Annual interest %',100,-10,100],['dividend','Annual dividend yield %',100,0,100],['commission','Option commission $ / contract / side',1,0,100],['stockCommission','Stock commission $ / share / side',1,0,10],['slippage','Slippage $ / share / side',1,0,100]].map(([key,label,scale,min,max])=><label key={key} className="text-xs text-gray-300">{label}<NumberField aria-label={label} invalidHint={`Enter a number from ${min} to ${max}`} value={Number((model[key]*scale).toFixed(6))} onCommit={raw=>{const value=Number(raw);if(!(Number.isFinite(value)&&value>=min&&value<=max))return false;setModel(m=>({...m,[key]:value/scale}));setCodeVerified(false);}} className="block w-full mt-1 p-2 rounded bg-gray-900 border border-gray-600"/></label>)}
                </div><p className="text-xs text-gray-400 mt-3">Continuous dividend yield affects option valuation; stock dividend cashflows are excluded. P/L subtracts entry + closing commissions and slippage, including at expiry. Entry premiums stay fixed when assumptions change. Entry debit/credit excludes fees. Generated code must be checked against these assumptions.</p></section>
                <div className="flex flex-wrap gap-3"><button onClick={undo} disabled={!history.length} className="px-3 py-2 rounded bg-indigo-700 disabled:opacity-40">Undo leg edit</button><label className="px-3 py-2 rounded bg-cyan-900 cursor-pointer">Import strategy JSON<input aria-label="Import strategy JSON" type="file" accept=".json,application/json" onChange={importStrategy} className="hidden"/></label></div>
                <StrategyBuilder legs={legs} setLegs={(next) => { setLegs(next); setStrategyType(StrategyTemplate.Custom); }} stockPrice={currentPrice}
                  onDeltaHedge={handleDeltaHedge} onSave={saveCurrentStrategy}
                  onSyncChain={syncLegsToChain}
                  chainSyncable={Boolean(market && market.chain)}
                  chainLookup={chainLookup}
                  model={model} iv30={market && market.iv30 != null ? market.iv30 : iv} spotProvenance={spotProvenance} />

                {marketError && (
                  <div className="bg-red-950/40 border border-red-700/50 rounded-lg p-3 text-xs text-red-300 flex items-start gap-2 leading-relaxed">
                    <AlertTriangle size={14} className="mt-0.5 flex-shrink-0" />
                    <div>{marketError}</div>
                  </div>
                )}

                <OptionChainPanel market={market} viewChain={viewChain}
                  onExpChange={(epoch) => setSelectedExpiryEpoch(epoch)}
                  onAddLeg={addChainLeg} relay={dataRelay} model={model} />

                <div className="p-4 rounded-lg bg-gradient-to-r from-gray-900 to-gray-800 border border-gray-700 flex justify-between items-center">
                  <div>
                    <h3 className="text-sm font-bold text-white mb-1">Generate Python Code</h3>
                    <p className="text-xs text-gray-400">Requires verification before use</p>
                  </div>
                  <button onClick={handleGenerateCode} disabled={isLoading}
                    className="flex items-center gap-2 bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded shadow transition-colors disabled:opacity-50">
                    <Code size={18} /> Generate
                  </button>
                </div>

                {storageNotice && (
                  <div role="alert" className="bg-amber-950/40 border border-amber-700/50 rounded-lg p-3 text-xs text-amber-200 flex items-start gap-2 leading-relaxed">
                    <AlertTriangle size={14} className="mt-0.5 flex-shrink-0" />
                    <div className="flex-1">{storageNotice}</div>
                    <button type="button" onClick={() => setStorageNotice(null)} className="text-amber-300 hover:text-white" aria-label="Dismiss storage notice">&times;</button>
                  </div>
                )}
                <SavedStrategies strategies={savedStrategies} onLoad={loadSavedStrategy}
                  onDelete={deleteSavedStrategy} persist={persistStrategies} />
              </div>

              <div className="lg:col-span-7 space-y-6">
                <StrategySummary legs={legs} />
                <ChartViz legs={legs} stockPrice={currentPrice} />
                <StrategyGreeks legs={legs} stockPrice={currentPrice} />
                <ScenarioLab legs={legs} stockPrice={currentPrice} meta={{ symbol, source: market?.source || underlyingSource, quoteTimestamp: market?.quoteTimestamp ?? null, model }} />
                <TradeComparison legs={legs} spot={currentPrice} symbol={symbol} snapshot={compareSnapshot} model={model} onCapture={()=>setCompareSnapshot({symbol,legs:JSON.parse(JSON.stringify(legs))})}/>
                <p className="text-xs text-gray-400">Probability analysis is intentionally unavailable pending independent validation of distribution assumptions and calendar behavior.</p>

                <div className="grid grid-cols-2 md:grid-cols-3 gap-4">
                  <div className="bg-tasty-panel p-4 rounded-lg border border-gray-700">
                    <p className="text-gray-500 text-xs">Underlying {market && market.symbol ? `· ${market.symbol}` : ''}</p>
                    <p className="text-xl font-bold text-white font-mono">${currentPrice.toFixed(2)}</p>
                    {market && market.prevClose != null && (
                      <p className="text-[10px] text-gray-500 font-mono">
                        prev close ${Number(market.prevClose).toFixed(2)} (
                        <span className={(currentPrice - market.prevClose) >= 0 ? 'text-tasty-accent' : 'text-tasty-danger'}>
                          {(currentPrice - market.prevClose) >= 0 ? '+' : ''}{((currentPrice - market.prevClose) / market.prevClose * 100).toFixed(2)}%
                        </span>)
                      </p>
                    )}
                  </div>
                  <div className="bg-tasty-panel p-4 rounded-lg border border-gray-700">
                    <p className="text-gray-500 text-xs">Est. IV</p>
                    <p className="text-xl font-bold text-blue-400 font-mono">{iv}%</p>
                  </div>
                  <div className="bg-tasty-panel p-4 rounded-lg border border-gray-700">
                    <p className="text-gray-500 text-xs">Legs Count</p>
                    <p className="text-xl font-bold text-purple-400 font-mono">{legs.length}</p>
                  </div>
                </div>

                {showCode && (
                  <div className="bg-gray-900 rounded-lg border border-gray-700 overflow-hidden">
                    <div className="bg-gray-800 px-4 py-2 flex justify-between items-center border-b border-gray-700">
                      <span className="text-xs font-mono text-gray-400">strategy_analysis.py <span className="text-yellow-400 ml-2">(UNVERIFIED)</span></span>
                      <button onClick={() => setShowCode(false)} className="text-gray-400 hover:text-white">&times;</button>
                    </div>
                    <div className="bg-yellow-900/20 border-b border-yellow-700/40 px-4 py-2 text-xs text-yellow-200 flex items-start gap-2">
                      <AlertTriangle size={14} className="flex-shrink-0 mt-0.5" />
                      <div>
                        <div className="font-bold mb-1">Step 10 — Verify before trusting</div>
                        <div className="text-yellow-200/80 leading-relaxed">
                          The built-in engine computes P/L at spot ({`$${currentPrice.toFixed(2)}`}) at expiry ={' '}
                          <span className="font-mono text-white font-bold">{referenceAtExpiry !== null ? formatCurrency(referenceAtExpiry) : '—'}</span>.
                          After running the Python code, check that its P/L at the same spot matches. If it does not match, the generated code is incorrect.
                        </div>
                      </div>
                    </div>
                    <pre className="p-4 text-xs font-mono text-green-400 overflow-x-auto whitespace-pre-wrap max-h-96">{generatedCode}</pre>
                    <div className="border-t border-gray-700 px-4 py-3">
                      <label className="flex items-start gap-2 cursor-pointer text-xs text-gray-300">
                        <input type="checkbox" checked={codeVerified} onChange={e => setCodeVerified(e.target.checked)} className="mt-0.5 accent-tasty-accent" />
                        <span>I have run this code and verified its output matches the built-in engine's reference value above.</span>
                      </label>
                      {codeVerified && (
                        <button onClick={() => {
                          navigator.clipboard.writeText(generatedCode);
                          alert('Copied to clipboard.');
                        }} className="mt-2 text-[10px] font-bold uppercase tracking-wider text-tasty-accent hover:text-tasty-accent/80">
                          <ClipboardCheck size={12} className="inline mr-1" /> Copy verified code
                        </button>
                      )}
                    </div>
                  </div>
                )}
              </div>
            </main>

            {/* Governance & verification modals */}
            <PriceVerificationModal
              pending={pendingVerification}
              staleReason={verificationStale}
              symbol={symbol}
              prevPrice={currentPrice}
              prevIv={iv}
              onAccept={acceptVerifiedPrice}
              onReject={rejectVerification}
            />

            <GovernancePanel
              open={governanceOpen}
              onClose={() => setGovernanceOpen(false)}
              callStats={callStats}
              enabled={externalCallsEnabled}
              onToggle={() => setExternalCallsEnabled(!externalCallsEnabled)}
              persist={persistStrategies}
              onTogglePersist={() => { if (persistStrategies) { try { localStorage.removeItem(STORAGE_KEY); } catch (_) {} } setPersistStrategies(!persistStrategies); }}
            />
          </div>
        );
      };

      /* ================================================================
         MOUNT
         ================================================================ */
      // Top-level error boundary (F7): a render failure shows a message instead of a blank page.
      class AppErrorBoundary extends React.Component {
        constructor(props) { super(props); this.state = { error: null }; }
        static getDerivedStateFromError(error) { return { error }; }
        componentDidCatch(error, info) { console.error('Render failure', error, info); }
        render() {
          if (!this.state.error) return this.props.children;
          return (
            <div role="alert" style={{ padding: '2rem', fontFamily: 'monospace', color: '#fecaca', maxWidth: 720 }}>
              <h1 style={{ fontSize: 18, fontWeight: 700, marginBottom: 12 }}>The page hit an error while rendering.</h1>
              <p style={{ marginBottom: 12 }}>{String((this.state.error && this.state.error.message) || this.state.error).slice(0, 300)}</p>
              <p style={{ marginBottom: 16, color: '#cbd5e1' }}>No orders can be placed by this tool. Reload to start again. Strategies already saved with persistence on are kept in this browser; after reloading, switch persistence on again in the Charter panel to see them.</p>
              <button type="button" onClick={() => window.location.reload()} style={{ padding: '6px 14px', border: '1px solid #f87171', borderRadius: 6 }}>Reload</button>
            </div>
          );
        }
      }

      const rootElement = document.getElementById('root');
      const root = createRoot(rootElement);
      root.render(
        <React.StrictMode>
          <AppErrorBoundary>
            <App />
          </AppErrorBoundary>
        </React.StrictMode>
      );
    </script>
  </body>
</html>
